  note: >-
    Female-minus-male coefficient, with heteroskedasticity-robust SE. The 19-item
    test covers panchayat rules and duties. The paper reports 47 reserved seats
    but 46 female presidents, with no women in unreserved seats (p. 246); gender
    and reservation are therefore not identical. Covariates include characteristics
    that may respond to reservation, so this is a conditional gender comparison,
    not a total reservation effect. Knowledge is excluded from the schooling pool.
