notes:
- >-
  Reserved and Open are group means; shares are percentages. Differences are reserved minus open, in outcome units (percentage points for shares), with standard errors in parentheses. Adjusted differences are regression coefficients. A dagger marks an SE reconstructed from shares and sample sizes or a reported t-statistic; these ignore clustering and repeated units. N is the combined group size or regression sample. SD rows use the GP's citizen distribution; selection scores measure position in the villager education distribution.
- Chattopadhyay and Duflo (2001) and Beaman et al. (2009) study the same Birbhum GPs in successive terms; the published version of Chattopadhyay and Duflo (2004) omits the pradhan-characteristics table. Karekurve-Ramachandra and Lee (2020) use the same Mumbai councillor data as this paper. Mori et al.'s published version (2025) reports the same-gender benchmark. Row-level source locations and transcription notes are in the repository's evidence/literature/studies files.
- Gajwani and Zhang's adjusted female-minus-male knowledge coefficient is excluded from the schooling meta-analysis; group means are unavailable.
- Bhavnani et al. (2024) contrasts appear in Table A.3 and are not pooled.
